<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest-admin.json">
  <meta name="theme-color" content="#0f0f13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TrimGest Admin">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js");}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrimGest Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f13; color: #f0ede8; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 16px; }
    .login { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 12px; }
    .logo { font-size: 13px; letter-spacing: 4px; color: #6a6070; text-transform: uppercase; }
    .title { font-size: 24px; color: #e8c87a; margin-bottom: 20px; }
    input { background: #16161e; border: 1px solid #2a2a3a; color: #e0d8cc; padding: 14px; border-radius: 10px; font-size: 16px; width: 100%; max-width: 300px; }
    .btn { background: #e8c87a; color: #1a1500; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; max-width: 300px; }
    .error { color: #c06060; font-size: 13px; }
    .panel { display: none; }
    .header { background: #16161e; padding: 16px 20px; border-radius: 12px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .header h1 { font-size: 18px; color: #e8c87a; }
    .header-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .stat { background: #16161e; border-radius: 10px; padding: 14px; }
    .stat-label { font-size: 10px; letter-spacing: 2px; color: #6a6070; text-transform: uppercase; margin-bottom: 6px; }
    .stat-value { font-size: 24px; color: #e8c87a; }
    .tabla-wrap { overflow-x: auto; border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; background: #16161e; min-width: 600px; }
    th { background: #0f0f13; padding: 10px 14px; text-align: left; font-size: 10px; letter-spacing: 2px; color: #6a6070; text-transform: uppercase; white-space: nowrap; }
    td { padding: 12px 14px; border-top: 1px solid #22223a; font-size: 13px; }
    .badge { font-size: 10px; padding: 3px 8px; border-radius: 6px; background: #1a2a1a; color: #7ec47e; }
    .badge-gratis { background: #1a1a2a; color: #e8c87a; }
    .badge-gestoria { background: #0d1f2b; color: #4ab4e8; border: 1px solid #1a4a6a; }
    .btn-ver { background: #1a2a1a; border: 1px solid #2a3a2a; color: #7ec47e; border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer; margin-right: 4px; }
    .btn-borrar { background: #2a1a1a; border: 1px solid #3a1a1a; color: #c06060; border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer; }
    .btn-gratis { background: #1a1a2a; border: 1px solid #2a2a5a; color: #7a7ae8; border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer; margin-right: 4px; }
    .btn-gratis.activo { background: #2a2a1a; border-color: #e8c87a; color: #e8c87a; }
    .btn-logout { background: none; border: 1px solid #2a2a3a; color: #6a6070; border-radius: 8px; padding: 8px 14px; font-size: 12px; cursor: pointer; }
    .btn-backup { background: #1a2a3a; border: 1px solid #2a4a6a; color: #7ab4e8; border-radius: 8px; padding: 8px 14px; font-size: 12px; cursor: pointer; }
    .btn-backup:hover { border-color: #7ab4e8; }
    .ficha { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0f0f13; z-index: 100; padding: 20px; overflow-y: auto; display: none; }
    .ficha-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .ficha-header h2 { color: #e8c87a; font-size: 18px; }
    .ficha-close { background: none; border: none; color: #6a6070; font-size: 24px; cursor: pointer; }
    .ficha-card { background: #16161e; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
    .ficha-card-title { font-size: 10px; letter-spacing: 2px; color: #6a6070; text-transform: uppercase; margin-bottom: 12px; }
    .ficha-row { font-size: 13px; margin-bottom: 8px; color: #9a90b4; }
    .ficha-row strong { color: #e0d8cc; }
    .ficha-nums { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .ficha-num { background: #16161e; border-radius: 10px; padding: 16px; text-align: center; }
    .ficha-num-label { font-size: 10px; letter-spacing: 2px; color: #6a6070; text-transform: uppercase; margin-bottom: 8px; }
    .ficha-num-value { font-size: 32px; color: #e8c87a; }
    @media (max-width: 768px) {
      body { padding: 10px; }
      .header { padding: 10px 12px; flex-direction: column; align-items: flex-start; }
      .header h1 { font-size: 16px; }
      .header-btns { width: 100%; justify-content: flex-start; }
      .btn-logout, .btn-backup { font-size: 11px; padding: 6px 10px; }
      .stats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .stat { padding: 10px; }
      .stat-value { font-size: 20px; }
      .tabla-wrap { border-radius: 10px; }
      .mobile-card { background: #16161e; border-radius: 10px; margin-bottom: 10px; padding: 14px; border: 1px solid #22223a; }
      .mobile-card-nombre { font-size: 15px; font-weight: 600; color: #e0d8cc; margin-bottom: 4px; }
      .mobile-card-email { font-size: 11px; color: #6a6070; margin-bottom: 10px; }
      .mobile-card-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
      .mobile-card-row span:first-child { color: #6a6070; }
      .mobile-card-row span:last-child { color: #e0d8cc; font-weight: 500; }
      .mobile-card-btns { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
      .mobile-card-btns button { flex: 1; min-width: 60px; }
      table { display: none; }
      .mobile-lista { display: block; }
    }
    .mobile-lista { display: none; }
  </style>
</head>
<body>
<div id="pwa-bar" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#16161e;border-top:1px solid #22223a;padding:8px 16px;display:none;justify-content:space-between;align-items:center;"><button onclick="window.history.back()" style="background:#1e1e28;border:1px solid #2a2a3a;color:#9a90b4;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;">← Atrás</button><button onclick="window.location.reload()" style="background:#1e1e28;border:1px solid #2a2a3a;color:#9a90b4;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;">⟳ Recargar</button></div><script>if(window.navigator.standalone || window.matchMedia("(display-mode: standalone)").matches){  var b=document.getElementById("pwa-bar");  if(b){b.style.display="flex";document.body.style.paddingBottom="52px";}}</script>

  <div class="login" id="loginPanel">
    <div class="logo"><svg width="120" height="32" viewBox="0 0 120 32" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="14" height="14" rx="2.5" fill="#e8c87a"/><rect x="16" y="0" width="14" height="14" rx="2.5" fill="none" stroke="#e8c87a" stroke-width="1.5"/><rect x="0" y="16" width="14" height="14" rx="2.5" fill="none" stroke="#e8c87a" stroke-width="1.5"/><rect x="16" y="16" width="14" height="14" rx="2.5" fill="none" stroke="#e8c87a" stroke-width="1.5"/><line x1="14.5" y1="0" x2="14.5" y2="30" stroke="#0f0f13" stroke-width="2"/><line x1="0" y1="14.5" x2="30" y2="14.5" stroke="#0f0f13" stroke-width="2"/><text x="38" y="12" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" font-weight="300" fill="#f0ede8" letter-spacing="-0.3">Trim</text><text x="38" y="27" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" font-weight="600" fill="#e8c87a" letter-spacing="-0.3">Gest</text></svg></div>
    <div class="title">Panel de Admin</div>
    <input type="password" id="adminPass" placeholder="Contrasena admin" onkeydown="if(event.key==='Enter')loginAdmin()">
    <button class="btn" onclick="loginAdmin()">Entrar</button>
    <div id="loginError" class="error"></div>
  </div>

  <div class="panel" id="adminPanel">
    <div class="header">
      <h1>TrimGest Admin</h1>
      <div class="header-btns">
        <button class="btn-backup" onclick="descargarBackup()">&#8595; Backup</button>
        <button class="btn-backup" onclick="restaurarBackup()" style="background:#2a1a2a;border-color:#6a2a6a;color:#c87ae8;">&#8593; Restaurar</button>
        <input type="file" id="inputRestore" accept=".json" style="display:none" onchange="procesarRestore(this)">
        <button class="btn-backup" onclick="verReferidosPendientes()" style="background:#1a2a1a;border-color:#4a8a4a;color:#7ec47e;">&#128176; Referidos</button>
        <button class="btn-logout" onclick="logout()">Cerrar sesion</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="tabla-wrap">
      <table>
        <thead>
          <tr>
            <th>Empresa</th>
            <th>Email</th>
            <th>Registro</th>
            <th>Facts</th>
            <th>Nom</th>
            <th>Plan</th>
            <th>Último acceso</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaUsuarios"></tbody>
      </table>
    </div>
    <div class="mobile-lista" id="mobileLista"></div>
  </div>

  <div id="referidosPanel" style="display:none;background:#16161e;border-radius:12px;padding:20px;margin:16px;max-width:900px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h2 style="color:#e8c87a;margin:0;">Solicitudes de pago referidos</h2>
      <button onclick="document.getElementById('referidosPanel').style.display='none'" style="background:none;border:1px solid #3a3a4a;color:#9a90b4;border-radius:8px;padding:6px 12px;cursor:pointer;">Cerrar</button>
    </div>
    <div id="referidosLista" style="font-size:13px;color:#9a90b4;">Cargando...</div>
  </div>

  <div class="ficha" id="fichaPanel">
    <div class="ficha-header">
      <h2 id="fichaNombre"></h2>
      <button class="ficha-close" onclick="cerrarFicha()">&#10005;</button>
    </div>
    <div class="ficha-card">
      <div class="ficha-card-title">Datos empresa</div>
      <div class="ficha-row"><strong>Email:</strong> <span id="fichaEmail"></span></div>
      <div class="ficha-row"><strong>NIF:</strong> <span id="fichaNif"></span></div>
      <div class="ficha-row"><strong>Direccion:</strong> <span id="fichaDireccion"></span></div>
      <div class="ficha-row"><strong>Registro:</strong> <span id="fichaFecha"></span></div>
      <div class="ficha-row"><strong>Plan:</strong> <span id="fichaPlan" class="badge"></span></div>
    </div>
    <div class="ficha-nums">
      <div class="ficha-num">
        <div class="ficha-num-label">Facturas</div>
        <div class="ficha-num-value" id="fichaFacturas"></div>
      </div>
      <div class="ficha-num">
        <div class="ficha-num-label">Nominas</div>
        <div class="ficha-num-value" id="fichaNominas"></div>
      </div>
    </div>
    <div class="ficha-card" id="fichaAccesosCard" style="display:none;">
      <div class="ficha-card-title" style="cursor:pointer;" onclick="toggleAccesos()">Historial de accesos <span id="fichaAccesosArrow">▼</span></div>
      <div id="fichaAccesosLista" style="display:none;max-height:200px;overflow-y:auto;"></div>
    </div>
  </div>

  <script>
    var API = 'https://trimgest.es';
    var adminPassword = localStorage.getItem('admin_pass');

    if (adminPassword) cargarPanel();

    async function loginAdmin() {
      var pass = document.getElementById('adminPass').value;
      var err = document.getElementById('loginError');
      try {
        var r = await fetch(API + '/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pass })
        });
        var data = await r.json();
        if (data.ok) {
          adminPassword = pass;
          localStorage.setItem('admin_pass', pass);
          cargarPanel();
        } else {
          err.textContent = 'Password incorrecta';
        }
      } catch(e) {
        err.textContent = 'Error de conexion';
      }
    }

    async function cargarPanel() {
      try {
        var r = await fetch(API + '/admin/usuarios', {
          headers: { 'x-admin-password': adminPassword }
        });
        if (!r.ok) { logout(); return; }
        var data = await r.json();

        document.getElementById('loginPanel').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        var esMobil = window.innerWidth <= 768;
        document.getElementById('mobileLista').style.display = esMobil ? 'block' : 'none';
        document.querySelector('.tabla-wrap').style.display = esMobil ? 'none' : 'block';

        var totalFacturas = data.usuarios.reduce(function(s, u) { return s + u.facturas; }, 0);
        var totalNominas = data.usuarios.reduce(function(s, u) { return s + u.nominas; }, 0);

        document.getElementById('stats').innerHTML =
          '<div class="stat"><div class="stat-label">Usuarios</div><div class="stat-value">' + data.total + '</div></div>' +
          '<div class="stat"><div class="stat-label">Facturas</div><div class="stat-value">' + totalFacturas + '</div></div>' +
          '<div class="stat"><div class="stat-label">Nominas</div><div class="stat-value">' + totalNominas + '</div></div>';

        var tbody = document.getElementById('tablaUsuarios');
        tbody.innerHTML = '';
        document.getElementById('mobileLista').innerHTML = '';
        data.usuarios.forEach(function(u) {
          var fecha = u.fecha_registro ? new Date(u.fecha_registro).toLocaleDateString('es-ES') : '-';
          var tr = document.createElement('tr');
          tr.innerHTML =
            '<td data-label="Empresa">' + u.nombre_empresa + '</td>' +
            '<td data-label="Email" style="color:#6a6070;font-size:11px;">' + u.email + '</td>' +
            '<td data-label="Registro" style="color:#6a6070;">' + fecha + '</td>' +
            '<td data-label="Facts">' + u.facturas + '</td>' +
            '<td data-label="Nom">' + u.nominas + '</td>' +
            '<td data-label="Plan"><span class="badge' + (u.tipo === 'gestoria' ? ' badge-gestoria' : u.plan_gratuito ? ' badge-gratis' : '') + '">' + (u.tipo === 'gestoria' ? '⚖ Gestoría' : u.plan_gratuito ? '★ gratis' : u.plan) + '</span>' + (u.tipo === 'gestoria' && u.clientesGestoria && u.clientesGestoria.length ? '<div style="font-size:10px;color:#4ab4e8;margin-top:4px;">' + u.clientesGestoria.filter(function(c){return !c.es_demo;}).map(function(c){return '· ' + (c.empresaNombre||c.empresaId);}).join('<br>') + '</div>' : '') + '</td>' +
            '<td style="font-size:11px;color:#6a6070;">' + (u.accesos && u.accesos.length ? new Date(u.accesos[u.accesos.length-1]).toLocaleString('es-ES') : '-') + '</td>' +
            '<td>' +
            '<button class="btn-gratis' + (u.plan_gratuito ? ' activo' : '') + '">' + (u.plan_gratuito ? '★' : 'Gratis') + '</button>' +
            '<button class="btn-ver">Ver</button>' +
            '<button class="btn-borrar">Borrar</button>' +
            '</td>';
          var btnVer = tr.querySelector('.btn-ver');
          var btnBorrar = tr.querySelector('.btn-borrar');
          var btnGratis = tr.querySelector('.btn-gratis');
          btnVer.addEventListener('click', function() { verEmpresa(u.empresaId, u.accesos); });
          btnBorrar.addEventListener('click', function() { borrarUsuario(u.id); });
          btnGratis.addEventListener('click', function() { toggleGratis(u.empresaId, !u.plan_gratuito); });
          tbody.appendChild(tr);

          // Tarjeta movil
          var card = document.createElement('div');
          card.className = 'mobile-card';
          var planLabel = u.tipo === 'gestoria' ? '⚖ Gestoría' : u.plan_gratuito ? '★ gratis' : (u.plan || 'free');
          card.innerHTML =
            '<div class="mobile-card-nombre">' + u.nombre_empresa + '</div>' +
            '<div class="mobile-card-email">' + u.email + '</div>' +
            '<div class="mobile-card-row"><span>Registro</span><span>' + fecha + '</span></div>' +
            '<div class="mobile-card-row"><span>Facturas</span><span>' + u.facturas + '</span></div>' +
            '<div class="mobile-card-row"><span>Nóminas</span><span>' + u.nominas + '</span></div>' +
            '<div class="mobile-card-row"><span>Último acceso</span><span>' + (u.accesos && u.accesos.length ? new Date(u.accesos[u.accesos.length-1]).toLocaleString('es-ES') : '-') + '</span></div>' +
            '<div class="mobile-card-row"><span>Plan</span><span>' + planLabel + '</span></div>' +
            (u.tipo === 'gestoria' && u.clientesGestoria && u.clientesGestoria.filter(function(c){return !c.es_demo;}).length ? '<div style="font-size:11px;color:#4ab4e8;margin-top:6px;"><span style="color:#6a6070;">Clientes: </span>' + u.clientesGestoria.filter(function(c){return !c.es_demo;}).map(function(c){return c.empresaNombre||c.empresaId;}).join(', ') + '</div>' : '') +
            '<div class="mobile-card-btns">' +
            '<button class="btn-gratis' + (u.plan_gratuito ? ' activo' : '') + '" data-card-gratis>' + (u.plan_gratuito ? '★ Gratis ON' : 'Dar gratis') + '</button>' +
            '<button class="btn-ver" data-card-ver>Ver</button>' +
            '<button class="btn-borrar" data-card-borrar>Borrar</button>' +
            '</div>';
          card.querySelector('[data-card-ver]').addEventListener('click', function() { verEmpresa(u.empresaId, u.accesos); });
          card.querySelector('[data-card-borrar]').addEventListener('click', function() { borrarUsuario(u.id); });
          card.querySelector('[data-card-gratis]').addEventListener('click', function() { toggleGratis(u.empresaId, !u.plan_gratuito); });
          document.getElementById('mobileLista').appendChild(card);
        });
      } catch(e) {
        logout();
      }
    }

    function toggleAccesos() {
      var lista = document.getElementById('fichaAccesosLista');
      var arrow = document.getElementById('fichaAccesosArrow');
      if (lista.style.display === 'none') { lista.style.display = 'block'; arrow.textContent = '▲'; }
      else { lista.style.display = 'none'; arrow.textContent = '▼'; }
    }

    async function verEmpresa(empresaId, accesos) {
      var r = await fetch(API + '/admin/empresa/' + empresaId, {
        headers: { 'x-admin-password': adminPassword }
      });
      var data = await r.json();
      if (!data.ok) return;
      var e = data.empresa;
      var fecha = e.fecha_registro ? new Date(e.fecha_registro).toLocaleDateString('es-ES') : '-';
      document.getElementById('fichaNombre').textContent = e.nombre_empresa;
      document.getElementById('fichaEmail').textContent = e.email;
      document.getElementById('fichaNif').textContent = e.nif || '-';
      document.getElementById('fichaDireccion').textContent = (e.direccion || '') + ' ' + (e.cp || '') + ' ' + (e.ciudad || '') + ' ' + (e.provincia || '');
      document.getElementById('fichaFecha').textContent = fecha;
      document.getElementById('fichaPlan').textContent = e.plan;
      document.getElementById('fichaFacturas').textContent = e.facturas;
      document.getElementById('fichaNominas').textContent = e.nominas;
      document.getElementById('fichaPanel').style.display = 'block';
      var accesosCard = document.getElementById('fichaAccesosCard');
      var accesosLista = document.getElementById('fichaAccesosLista');
      if (accesos && accesos.length) {
        accesosCard.style.display = 'block';
        accesosLista.innerHTML = accesos.slice().reverse().map(function(a) {
          return '<div style="font-size:12px;color:#9a90b4;padding:4px 0;border-bottom:1px solid #1a1a25;">' + new Date(a).toLocaleString('es-ES') + '</div>';
        }).join('');
      } else {
        accesosCard.style.display = 'none';
      }
    }

    function cerrarFicha() {
      document.getElementById('fichaPanel').style.display = 'none';
    }

    async function borrarUsuario(id) {
      if (!confirm('Seguro que quieres borrar este usuario y todos sus datos?')) return;
      await fetch(API + '/admin/usuarios/' + id, {
        method: 'DELETE',
        headers: { 'x-admin-password': adminPassword }
      });
      cargarPanel();
    }

    async function toggleGratis(empresaId, activo) {
      var label = activo ? 'Dar acceso gratuito a este usuario?' : 'Quitar acceso gratuito?';
      if (!confirm(label)) return;
      await fetch(API + '/admin/plan-gratuito', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
        body: JSON.stringify({ empresaId: empresaId, activo: activo })
      });
      cargarPanel();
    }

    function restaurarBackup() {
      if (!confirm('ATENCION: Esto sobreescribira todos los datos actuales con el backup. Estas seguro?')) return;
      document.getElementById('inputRestore').click();
    }

    async function procesarRestore(input) {
      var file = input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = async function(e) {
        try {
          var backup = JSON.parse(e.target.result);
          var r = await fetch(API + '/admin/restore', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
            body: JSON.stringify(backup)
          });
          var d = await r.json();
          if (d.ok) {
            alert('Backup restaurado correctamente. Recarga la pagina.');
            cargarPanel();
          } else {
            alert('Error: ' + (d.error || 'Error desconocido'));
          }
        } catch(err) {
          alert('Error al procesar el archivo: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    function descargarBackup() {
      var fecha = new Date().toISOString().split('T')[0];
      var a = document.createElement('a');
      a.href = API + '/admin/backup';
      a.setAttribute('download', 'trimgest-backup-' + fecha + '.json');
      var headers = new Headers({ 'x-admin-password': adminPassword });
      fetch(API + '/admin/backup', { headers: headers })
        .then(function(r) { return r.blob(); })
        .then(function(blob) {
          var url = URL.createObjectURL(blob);
          a.href = url;
          a.click();
          URL.revokeObjectURL(url);
        });
    }

    async function verReferidosPendientes() {
      var panel = document.getElementById('referidosPanel');
      var lista = document.getElementById('referidosLista');
      panel.style.display = 'block';
      lista.innerHTML = 'Cargando...';
      try {
        var r = await fetch(API + '/referidos/admin/pendientes', { headers: { 'x-admin-password': adminPassword } });
        var data = await r.json();
        if (!data.length) { lista.innerHTML = '<p style="color:#6a6070;">No hay solicitudes pendientes.</p>'; return; }
        lista.innerHTML = data.map(function(s) {
          return '<div style="background:#1e1e28;border-radius:10px;padding:14px;margin-bottom:10px;">' +
            '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;">' +
            '<div>' +
            '<div style="color:#e0d8cc;font-weight:600;">' + s.nombre + ' <span style="color:#6a6070;font-size:11px;">(' + (s.tipo === 'gestoria' ? 'Gestoria' : 'Empresa') + ')</span></div>' +
            '<div style="color:#9a90b4;font-size:12px;">' + s.email + '</div>' +
            '<div style="color:#9a90b4;font-size:12px;margin-top:6px;">IBAN: <span style="color:#e0d8cc;">' + s.iban + '</span></div>' +
            '<div style="color:#9a90b4;font-size:12px;">DNI: <span style="color:#e0d8cc;">' + s.dni + '</span></div>' +
            '<div style="color:#9a90b4;font-size:12px;">Fecha: ' + new Date(s.fecha).toLocaleDateString('es-ES') + '</div>' +
            '</div>' +
            '<div style="text-align:right;">' +
            '<div style="font-size:20px;font-weight:700;color:#e8c87a;margin-bottom:8px;">' + s.importe + '€</div>' +
            '<button data-id="' + s.empresaId + '" class="btn-marcar-pagado" style="background:#1a2a1a;border:1px solid #4a8a4a;color:#7ec47e;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;">Marcar pagado</button>' +
            '</div>' +
            '</div>' +
            '</div>';
        }).join('');
      document.querySelectorAll('.btn-marcar-pagado').forEach(function(btn) {
        btn.addEventListener('click', function() { marcarReferidoPagado(this.dataset.id); });
      });
      } catch(e) { lista.innerHTML = '<p style="color:#c06060;">Error al cargar.</p>'; }
    }

    async function marcarReferidoPagado(empresaId) {
      if (!confirm('Marcar como pagado y resetear saldo a 0?')) return;
      try {
        var r = await fetch(API + '/referidos/admin/marcar-pagado', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
          body: JSON.stringify({ empresaId: empresaId })
        });
        var d = await r.json();
        if (d.ok) verReferidosPendientes();
        else alert(d.error || 'Error');
      } catch(e) { alert('Error de conexion'); }
    }

    function logout() {
      localStorage.removeItem('admin_pass');
      adminPassword = null;
      document.getElementById('adminPanel').style.display = 'none';
      document.getElementById('loginPanel').style.display = 'flex';
    }
  </script>
</body>
</html>
