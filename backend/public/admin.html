<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrimGest Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f13; color: #f0ede8; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; }
    .login { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 12px; }
    .logo { font-size: 13px; letter-spacing: 4px; color: #6a6070; text-transform: uppercase; }
    .title { font-size: 24px; color: #e8c87a; margin-bottom: 20px; }
    input { background: #16161e; border: 1px solid #2a2a3a; color: #e0d8cc; padding: 14px; border-radius: 10px; font-size: 16px; width: 100%; max-width: 300px; }
    .btn { background: #e8c87a; color: #1a1500; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; max-width: 300px; }
    .error { color: #c06060; font-size: 13px; }
    .panel { display: none; }
    .header { background: #16161e; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 20px; color: #e8c87a; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat { background: #16161e; border-radius: 10px; padding: 16px; }
    .stat-label { font-size: 11px; letter-spacing: 2px; color: #6a6070; text-transform: uppercase; margin-bottom: 6px; }
    .stat-value { font-size: 28px; color: #e8c87a; }
    table { width: 100%; border-collapse: collapse; background: #16161e; border-radius: 12px; overflow: hidden; }
    th { background: #0f0f13; padding: 12px 16px; text-align: left; font-size: 11px; letter-spacing: 2px; color: #6a6070; text-transform: uppercase; }
    td { padding: 14px 16px; border-top: 1px solid #22223a; font-size: 14px; }
    .badge { font-size: 10px; padding: 3px 8px; border-radius: 6px; background: #1a2a1a; color: #7ec47e; }
    .btn-borrar { background: #2a1a1a; border: 1px solid #3a1a1a; color: #c06060; border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
    .btn-logout { background: none; border: 1px solid #2a2a3a; color: #6a6070; border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="login" id="loginPanel">
    <div class="logo">TrimGest</div>
    <div class="title">Panel de Admin</div>
    <input type="password" id="adminPass" placeholder="Contraseña admin" onkeydown="if(event.key==='Enter')loginAdmin()">
    <button class="btn" onclick="loginAdmin()">Entrar</button>
    <div id="loginError" class="error"></div>
  </div>

  <div class="panel" id="adminPanel">
    <div class="header">
      <h1>TrimGest Admin</h1>
      <button class="btn-logout" onclick="logout()">Cerrar sesion</button>
    </div>
    <div class="stats" id="stats"></div>
    <table>
      <thead>
        <tr>
          <th>Empresa</th>
          <th>Email</th>
          <th>Registro</th>
          <th>Facturas</th>
          <th>Nominas</th>
          <th>Plan</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tablaUsuarios"></tbody>
    </table>
  </div>

  <script>
    const API = 'https://trimgest.es';
    var adminPassword = sessionStorage.getItem('admin_pass');

    if (adminPassword) cargarPanel();

    async function loginAdmin() {
      var pass = document.getElementById('adminPass').value;
      var err = document.getElementById('loginError');
      try {
        var res = await fetch(API + '/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pass })
        });
        var data = await res.json();
        if (data.ok) {
          adminPassword = pass;
          sessionStorage.setItem('admin_pass', pass);
          cargarPanel();
        } else {
          err.textContent = 'Password incorrecta';
        }
      } catch(e) {
        err.textContent = 'Error de conexion';
      }
    }

    async function cargarPanel() {
      try {
        var res = await fetch(API + '/admin/usuarios', {
          headers: { 'x-admin-password': adminPassword }
        });
        if (!res.ok) { logout(); return; }
        var data = await res.json();

        document.getElementById('loginPanel').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';

        var totalFacturas = data.usuarios.reduce(function(s, u) { return s + u.facturas; }, 0);
        var totalNominas = data.usuarios.reduce(function(s, u) { return s + u.nominas; }, 0);

        document.getElementById('stats').innerHTML =
          '<div class="stat"><div class="stat-label">Usuarios</div><div class="stat-value">' + data.total + '</div></div>' +
          '<div class="stat"><div class="stat-label">Facturas totales</div><div class="stat-value">' + totalFacturas + '</div></div>' +
          '<div class="stat"><div class="stat-label">Nominas totales</div><div class="stat-value">' + totalNominas + '</div></div>';

        var tbody = document.getElementById('tablaUsuarios');
        tbody.innerHTML = '';
        data.usuarios.forEach(function(u) {
          var fecha = u.fecha_registro ? new Date(u.fecha_registro).toLocaleDateString('es-ES') : '-';
          var tr = document.createElement('tr');
          tr.innerHTML =
            '<td>' + u.nombre_empresa + '</td>' +
            '<td style="color:#6a6070;">' + u.email + '</td>' +
            '<td style="color:#6a6070;">' + fecha + '</td>' +
            '<td>' + u.facturas + '</td>' +
            '<td>' + u.nominas + '</td>' +
            '<td><span class="badge">' + u.plan + '</span></td>' +
            '<td style="display:flex;gap:6px;"><button onclick="verEmpresa('' + u.empresaId + '')" style="background:#1a2a1a;border:1px solid #2a3a2a;color:#7ec47e;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;">Ver</button><button class="btn-borrar" onclick="borrarUsuario(' + u.id + ')">Borrar</button></td>';
          tbody.appendChild(tr);
        });
      } catch(e) {
        logout();
      }
    }

    async function verEmpresa(empresaId) {
      var res = await fetch(API + '/admin/empresa/' + empresaId, {
        headers: { 'x-admin-password': adminPassword }
      });
      var data = await res.json();
      if (!data.ok) return;
      var e = data.empresa;
      var fecha = e.fecha_registro ? new Date(e.fecha_registro).toLocaleDateString('es-ES') : '-';

      var div = document.createElement('div');
      div.id = 'fichaPanel';
      div.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#0f0f13;z-index:100;padding:30px;overflow-y:auto;';
      div.innerHTML =
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">' +
        '<h2 style="color:#e8c87a;">' + e.nombre_empresa + '</h2>' +
        '<button onclick="document.getElementById('fichaPanel').remove()" style="background:none;border:none;color:#6a6070;font-size:24px;cursor:pointer;">X</button>' +
        '</div>' +
        '<div style="display:grid;gap:12px;">' +
        '<div style="background:#16161e;border-radius:10px;padding:16px;">' +
        '<div style="font-size:11px;letter-spacing:2px;color:#6a6070;text-transform:uppercase;margin-bottom:12px;">Datos empresa</div>' +
        '<div style="display:grid;gap:8px;font-size:14px;">' +
        '<div><span style="color:#6a6070;">Email: </span>' + e.email + '</div>' +
        '<div><span style="color:#6a6070;">NIF: </span>' + e.nif + '</div>' +
        '<div><span style="color:#6a6070;">Direccion: </span>' + e.direccion + ' ' + e.cp + ' ' + e.ciudad + ' ' + e.provincia + '</div>' +
        '<div><span style="color:#6a6070;">Registro: </span>' + fecha + '</div>' +
        '<div><span style="color:#6a6070;">Plan: </span><span style="background:#1a2a1a;color:#7ec47e;padding:2px 8px;border-radius:6px;font-size:12px;">' + e.plan + '</span></div>' +
        '</div></div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">' +
        '<div style="background:#16161e;border-radius:10px;padding:16px;text-align:center;">' +
        '<div style="font-size:11px;letter-spacing:2px;color:#6a6070;text-transform:uppercase;margin-bottom:8px;">Facturas</div>' +
        '<div style="font-size:36px;color:#e8c87a;">' + e.facturas + '</div>' +
        '</div>' +
        '<div style="background:#16161e;border-radius:10px;padding:16px;text-align:center;">' +
        '<div style="font-size:11px;letter-spacing:2px;color:#6a6070;text-transform:uppercase;margin-bottom:8px;">Nominas</div>' +
        '<div style="font-size:36px;color:#e8c87a;">' + e.nominas + '</div>' +
        '</div></div>' +
        '</div>';
      document.body.appendChild(div);
    }

    async function borrarUsuario(id) {
      if (!confirm('Seguro que quieres borrar este usuario y todos sus datos?')) return;
      await fetch(API + '/admin/usuarios/' + id, {
        method: 'DELETE',
        headers: { 'x-admin-password': adminPassword }
      });
      cargarPanel();
    }

    function logout() {
      sessionStorage.removeItem('admin_pass');
      adminPassword = null;
      document.getElementById('adminPanel').style.display = 'none';
      document.getElementById('loginPanel').style.display = 'flex';
    }
  </script>
</body>
</html>
