<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrimGest</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f13; color: #f0ede8; font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 480px; margin: 0 auto; min-height: 100vh; }
    .pin-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 20px; }
    .pin-logo { font-size: 13px; letter-spacing: 4px; color: #6a6070; text-transform: uppercase; margin-bottom: 8px; }
    .pin-title { font-size: 28px; font-weight: 400; color: #e8c87a; margin-bottom: 40px; }
    .pin-dots { display: flex; gap: 16px; margin-bottom: 40px; }
    .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #3a3045; background: transparent; transition: all 0.15s; }
    .pin-dot.filled { background: #e8c87a; border-color: #e8c87a; }
    .pin-dot.error { background: #c06060; border-color: #c06060; }
    .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 260px; }
    .pin-btn { background: #16161e; border: 1px solid #22223a; border-radius: 50%; width: 76px; height: 76px; font-size: 24px; color: #f0ede8; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.1s; }
    .pin-btn:active { background: #22223a; transform: scale(0.95); }
    .pin-btn.delete { font-size: 18px; color: #9a90b4; }
    .pin-btn.empty { background: transparent; border: none; cursor: default; }
    .pin-forgot { margin-top: 24px; font-size: 13px; color: #6a6070; cursor: pointer; text-decoration: underline; }
    .pin-error { color: #c06060; font-size: 13px; margin-top: 12px; }
    .recovery-screen { display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 20px; }
    .recovery-title { font-size: 20px; color: #f0ede8; margin-bottom: 8px; }
    .recovery-sub { font-size: 13px; color: #6a6070; margin-bottom: 30px; text-align: center; }
    .recovery-input { background: #16161e; border: 1px solid #2a2a3a; color: #e0d8cc; padding: 14px; border-radius: 10px; font-size: 20px; text-align: center; letter-spacing: 8px; width: 200px; margin-bottom: 16px; }
    .btn-recovery { background: #e8c87a; color: #1a1500; border: none; border-radius: 10px; padding: 14px 28px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; max-width: 260px; margin-bottom: 12px; }
    .btn-back { background: none; border: none; color: #6a6070; font-size: 13px; cursor: pointer; text-decoration: underline; }
    .main-app { display: none; }
    .header { background: #16161e; padding: 24px 20px 20px; border-bottom: 1px solid #22223a; }
    .header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .label { font-size: 11px; letter-spacing: 3px; color: #6a6070; text-transform: uppercase; margin-bottom: 4px; }
    h1 { font-size: 24px; font-weight: 500; }
    .selectores { display: flex; gap: 8px; margin-top: 10px; margin-bottom: 16px; }
    .selectores select { background: #1e1e28; border: 1px solid #2a2a3a; color: #e0d8cc; padding: 6px 10px; border-radius: 8px; font-size: 13px; cursor: pointer; }
    .btn-subir { background: #e8c87a; color: #1a1500; border: none; border-radius: 10px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn-ajustes { background: none; border: none; color: #6a6070; font-size: 22px; cursor: pointer; padding: 8px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat { background: #1e1e28; border-radius: 10px; padding: 14px; }
    .stat-label { font-size: 10px; letter-spacing: 2px; color: #6a6070; text-transform: uppercase; margin-bottom: 6px; }
    .stat-value { font-size: 20px; color: #c06060; margin-bottom: 4px; }
    .stat-value.verde { color: #7ec47e; }
    .stat-count { font-size: 11px; color: #4a4055; }
    .content { padding: 20px; }
    .upload-area { display: none; margin-bottom: 20px; }
    .upload-box { background: #16161e; border: 2px dashed #2a2a3a; border-radius: 14px; padding: 24px 20px; }
    .upload-title { font-size: 16px; color: #e0d8cc; margin-bottom: 6px; text-align: center; }
    .upload-sub { font-size: 12px; color: #5a5565; margin-bottom: 16px; text-align: center; }
    .tipo-selector { display: flex; gap: 10px; margin-bottom: 16px; }
    .tipo-btn { flex: 1; padding: 12px; border-radius: 10px; border: 2px solid #2a2a3a; background: #1e1e28; color: #6a6070; font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; transition: all 0.15s; }
    .tipo-btn.selected-prov { border-color: #c06060; color: #c06060; background: #2a1a1a; }
    .tipo-btn.selected-cli { border-color: #7ec47e; color: #7ec47e; background: #1a2a1a; }
    .upload-btns { display: flex; gap: 10px; }
    .btn-file { background: #e8c87a; color: #1a1500; border: none; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; flex: 1; }
    .btn-file:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-camara { background: #1e1e28; color: #e0d8cc; border: 1px solid #2a2a3a; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; flex: 1; }
    .btn-camara:disabled { opacity: 0.4; cursor: not-allowed; }
    .uploading { color: #9a90b4; font-size: 13px; margin-top: 12px; text-align: center; }
    .success { color: #7ec47e; font-size: 13px; margin-top: 12px; text-align: center; }
    .error { color: #c06060; font-size: 13px; margin-top: 12px; text-align: center; }
    .duplicado { color: #c08040; font-size: 13px; margin-top: 12px; background: #2a1e10; border-radius: 8px; padding: 10px; text-align: center; }
    .section-title { font-size: 11px; letter-spacing: 2px; color: #6a6070; text-transform: uppercase; margin-bottom: 14px; }
    .empty { text-align: center; color: #4a4055; padding: 40px 20px; font-size: 14px; }
    .facturas-list { display: flex; flex-direction: column; gap: 10px; }
    .factura-card { background: #16161e; border: 1px solid #22223a; border-radius: 12px; padding: 14px; }
    .factura-card.enviada { opacity: 0.5; }
    .factura-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .factura-nombre { font-size: 15px; font-weight: 500; color: #e0d8cc; }
    .factura-badges { display: flex; gap: 6px; align-items: center; }
    .factura-badge { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; }
    .badge-proveedor { background: #2a1a1a; color: #c06060; }
    .badge-cliente { background: #1a2a1a; color: #7ec47e; }
    .badge-enviada { background: #1a1a2a; color: #6a80c0; }
    .factura-datos { display: flex; gap: 12px; font-size: 12px; color: #6a6070; margin-bottom: 6px; flex-wrap: wrap; }
    .factura-total { color: #e8c87a; font-weight: 600; }
    .factura-desglose { font-size: 11px; color: #4a4055; margin-bottom: 8px; }
    .factura-acciones { display: flex; gap: 6px; margin-top: 10px; }
    .btn-accion { font-size: 11px; padding: 5px 10px; border-radius: 6px; border: 1px solid #2a2a3a; background: #1e1e28; color: #9a90b4; cursor: pointer; }
    .btn-borrar { font-size: 11px; padding: 5px 10px; border-radius: 6px; border: 1px solid #3a1a1a; background: #2a1a1a; color: #c06060; cursor: pointer; }
    .edit-form { margin-top: 12px; display: none; flex-direction: column; gap: 8px; }
    .edit-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .edit-input { background: #1e1e28; border: 1px solid #2a2a3a; color: #e0d8cc; padding: 5px 8px; border-radius: 6px; font-size: 12px; width: 100%; }
    .edit-row select { background: #1e1e28; border: 1px solid #2a2a3a; color: #e0d8cc; padding: 5px 8px; border-radius: 6px; font-size: 12px; }
    .btn-guardar { font-size: 12px; padding: 8px 16px; border-radius: 6px; border: none; background: #e8c87a; color: #1a1500; cursor: pointer; font-weight: 600; width: 100%; margin-top: 4px; }
    .tabs { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 1px solid #22223a; }
    .tab { padding: 8px 16px; font-size: 13px; color: #6a6070; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tab.active { color: #e8c87a; border-bottom-color: #e8c87a; }
    .btn-generar { width: 100%; background: #e8c87a; color: #1a1500; border: none; border-radius: 12px; padding: 16px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; }
    .btn-marcar { width: 100%; background: #2a3a2a; color: #7ec47e; border: 1px solid #3a5a3a; border-radius: 12px; padding: 14px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="pin-screen" id="pinScreen">
    <div class="pin-logo">TrimGest</div>
    <div class="pin-title">Introduce tu PIN</div>
    <div class="pin-dots">
      <div class="pin-dot" id="d0"></div>
      <div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div>
    </div>
    <div class="pin-grid">
      <button class="pin-btn" onclick="addPin('1')">1</button>
      <button class="pin-btn" onclick="addPin('2')">2</button>
      <button class="pin-btn" onclick="addPin('3')">3</button>
      <button class="pin-btn" onclick="addPin('4')">4</button>
      <button class="pin-btn" onclick="addPin('5')">5</button>
      <button class="pin-btn" onclick="addPin('6')">6</button>
      <button class="pin-btn" onclick="addPin('7')">7</button>
      <button class="pin-btn" onclick="addPin('8')">8</button>
      <button class="pin-btn" onclick="addPin('9')">9</button>
      <button class="pin-btn empty"></button>
      <button class="pin-btn" onclick="addPin('0')">0</button>
      <button class="pin-btn delete" onclick="deletePin()">⌫</button>
    </div>
    <div class="pin-forgot" onclick="showRecovery()">¿Olvidaste el PIN?</div>
    <div id="pinError" class="pin-error"></div>
  </div>

  <div class="recovery-screen" id="recoveryScreen">
    <div class="recovery-title">Recuperar acceso</div>
    <div class="recovery-sub" id="recoveryStep1">Te enviaremos un código a feimcateva@gmail.com</div>
    <button class="btn-recovery" id="btnEnviarCodigo" onclick="enviarCodigo()">Enviar código</button>
    <div id="recoveryStep2" style="display:none; flex-direction:column; align-items:center; gap:12px; width:100%; max-width:260px;">
      <div class="recovery-sub">Introduce el código recibido</div>
      <input class="recovery-input" id="codigoInput" placeholder="000000" maxlength="6" type="number">
      <div class="recovery-sub">Nuevo PIN (4 dígitos)</div>
      <input class="recovery-input" id="nuevoPinInput" placeholder="0000" maxlength="4" type="password">
      <button class="btn-recovery" onclick="resetearPin()">Cambiar PIN</button>
    </div>
    <div id="recoveryMsg" style="margin-top:12px; font-size:13px;"></div>
    <button class="btn-back" onclick="showPin()">← Volver</button>
  </div>

  <div class="main-app" id="mainApp">
    <div id="app"></div>
  </div>

  <script>
    const API = 'https://trimgest-production.up.railway.app';
    window.trimestreSel = null;
    window.annoSel = null;
    window.tabSel = 'pendientes';
    window.tipoSel = null;
    window.uploadOpen = false;
    window.chatHistorial = [];
    var pinValue = '';

    function getTrimestre() {
      const m = new Date().getMonth();
      if (m <= 2) return 'T1';
      if (m <= 5) return 'T2';
      if (m <= 8) return 'T3';
      return 'T4';
    }

    function formatEur(n) {
      return Number(n).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
    }

    function addPin(digit) {
      if (pinValue.length >= 4) return;
      pinValue += digit;
      updateDots();
      if (pinValue.length === 4) verificarPin();
    }

    function deletePin() {
      pinValue = pinValue.slice(0, -1);
      updateDots(false);
    }

    function updateDots(error) {
      for (var i = 0; i < 4; i++) {
        var dot = document.getElementById('d' + i);
        dot.className = 'pin-dot';
        if (error) dot.classList.add('error');
        else if (i < pinValue.length) dot.classList.add('filled');
      }
    }

    async function verificarPin() {
      var res = await fetch(API + '/auth/verificar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: pinValue })
      });
      var data = await res.json();
      if (data.ok) {
        document.getElementById('pinScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        window.trimestreSel = getTrimestre();
        window.annoSel = String(new Date().getFullYear());
        renderApp();
      } else {
        updateDots(true);
        document.getElementById('pinError').textContent = 'PIN incorrecto';
        setTimeout(function() {
          pinValue = '';
          updateDots(false);
          document.getElementById('pinError').textContent = '';
        }, 1000);
      }
    }

    function showRecovery() {
      document.getElementById('pinScreen').style.display = 'none';
      document.getElementById('recoveryScreen').style.display = 'flex';
    }

    function showPin() {
      document.getElementById('recoveryScreen').style.display = 'none';
      document.getElementById('pinScreen').style.display = 'flex';
      pinValue = '';
      updateDots(false);
    }

    async function enviarCodigo() {
      var btn = document.getElementById('btnEnviarCodigo');
      btn.textContent = 'Enviando...';
      btn.disabled = true;
      var res = await fetch(API + '/auth/recuperar', { method: 'POST' });
      var data = await res.json();
      if (data.ok) {
        document.getElementById('recoveryStep1').style.display = 'none';
        btn.style.display = 'none';
        document.getElementById('recoveryStep2').style.display = 'flex';
        document.getElementById('recoveryMsg').textContent = '✓ Código enviado a feimcateva@gmail.com';
        document.getElementById('recoveryMsg').style.color = '#7ec47e';
      } else {
        document.getElementById('recoveryMsg').textContent = 'Error enviando el código';
        document.getElementById('recoveryMsg').style.color = '#c06060';
        btn.textContent = 'Enviar código';
        btn.disabled = false;
      }
    }

    async function resetearPin() {
      var codigo = document.getElementById('codigoInput').value;
      var pinNuevo = document.getElementById('nuevoPinInput').value;
      if (pinNuevo.length !== 4) {
        document.getElementById('recoveryMsg').textContent = 'El PIN debe tener 4 dígitos';
        document.getElementById('recoveryMsg').style.color = '#c06060';
        return;
      }
      var res = await fetch(API + '/auth/resetear', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ codigo: codigo, pin_nuevo: pinNuevo })
      });
      var data = await res.json();
      if (data.ok) {
        document.getElementById('recoveryMsg').textContent = '✓ PIN cambiado correctamente';
        document.getElementById('recoveryMsg').style.color = '#7ec47e';
        setTimeout(showPin, 1500);
      } else {
        document.getElementById('recoveryMsg').textContent = data.error || 'Error';
        document.getElementById('recoveryMsg').style.color = '#c06060';
      }
    }

    function mostrarAsesor() {
      if (!window.trimestreSel) window.trimestreSel = getTrimestre();
      if (!window.annoSel) window.annoSel = String(new Date().getFullYear());
      window.chatHistorial = [];
      var div = document.createElement('div');
      div.id = 'asesorPanel';
      div.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#0f0f13;z-index:100;display:flex;flex-direction:column;max-width:480px;margin:0 auto;';
      div.innerHTML =
        '<div style="background:#16161e;padding:20px;border-bottom:1px solid #22223a;display:flex;justify-content:space-between;align-items:center;">' +
        '<div><div style="font-size:11px;letter-spacing:3px;color:#6a6070;text-transform:uppercase;">TrimGest</div>' +
        '<div style="font-size:18px;color:#e8c87a;">&#129302; Asesor financiero</div></div>' +
        '<button onclick="cerrarAsesor()" style="background:none;border:none;color:#6a6070;font-size:24px;cursor:pointer;">&#215;</button>' +
        '</div>' +
        '<div style="padding:16px;background:#12121a;border-bottom:1px solid #22223a;">' +
        '<div style="font-size:12px;color:#6a6070;margin-bottom:8px;">Objetivo de beneficio este trimestre (&#8364;)</div>' +
        '<div style="display:flex;gap:8px;">' +
        '<input id="objetivoInput" type="number" placeholder="ej. 5000" style="background:#16161e;border:1px solid #2a2a3a;color:#e0d8cc;padding:8px 12px;border-radius:8px;font-size:14px;flex:1;">' +
        '<button onclick="guardarObjetivo()" style="background:#e8c87a;color:#1a1500;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;">Guardar</button>' +
        '</div>' +
        '<div id="objetivoMsg" style="font-size:12px;margin-top:6px;"></div>' +
        '</div>' +
        '<div id="chatMessages" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;">' +
        '<div style="background:#16161e;border-radius:12px;padding:14px;font-size:14px;color:#9a90b4;">' +
        'Hola, soy tu asesor financiero. Puedo ayudarte a entender c&oacute;mo va tu negocio este trimestre. &iquest;Qu&eacute; quieres saber?' +
        '</div>' +
        '</div>' +
        '<div style="padding:16px;background:#16161e;border-top:1px solid #22223a;display:flex;gap:8px;">' +
        '<input id="chatInput" type="text" placeholder="Preg&uacute;ntame lo que quieras..." style="background:#1e1e28;border:1px solid #2a2a3a;color:#e0d8cc;padding:12px;border-radius:10px;font-size:14px;flex:1;" onkeydown="if(event.key===\'Enter\')enviarMensaje();">' +
        '<button onclick="enviarMensaje()" style="background:#e8c87a;color:#1a1500;border:none;border-radius:10px;padding:12px 16px;font-size:16px;cursor:pointer;">&#8594;</button>' +
        '</div>';
      document.body.appendChild(div);
    }

    function cerrarAsesor() {
      var panel = document.getElementById('asesorPanel');
      if (panel) panel.remove();
    }

    async function guardarObjetivo() {
      var objetivo = document.getElementById('objetivoInput').value;
      var msg = document.getElementById('objetivoMsg');
      if (!objetivo) return;
      var res = await fetch(API + '/asesor/objetivo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ objetivo: objetivo })
      });
      var data = await res.json();
      if (data.ok) {
        msg.style.color = '#7ec47e';
        msg.textContent = '&#10003; Objetivo guardado';
        setTimeout(function() { msg.textContent = ''; }, 2000);
      }
    }

    async function enviarMensaje() {
      var input = document.getElementById('chatInput');
      var mensaje = input.value.trim();
      if (!mensaje) return;
      input.value = '';
      var messages = document.getElementById('chatMessages');
      var userMsg = document.createElement('div');
      userMsg.style.cssText = 'background:#1e1e28;border-radius:12px;padding:14px;font-size:14px;color:#e0d8cc;align-self:flex-end;max-width:85%;';
      userMsg.textContent = mensaje;
      messages.appendChild(userMsg);
      var loadingMsg = document.createElement('div');
      loadingMsg.style.cssText = 'background:#16161e;border-radius:12px;padding:14px;font-size:14px;color:#6a6070;';
      loadingMsg.textContent = 'Pensando...';
      messages.appendChild(loadingMsg);
      messages.scrollTop = messages.scrollHeight;
      window.chatHistorial.push({ role: 'user', content: mensaje });
      try {
        var res = await fetch(API + '/asesor/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mensaje: mensaje,
            trimestre: window.trimestreSel,
            anno: window.annoSel,
            historial: window.chatHistorial.slice(-6)
          })
        });
        var data = await res.json();
        loadingMsg.style.color = '#9a90b4';
        loadingMsg.textContent = data.respuesta;
        window.chatHistorial.push({ role: 'assistant', content: data.respuesta });
      } catch(e) {
        loadingMsg.style.color = '#c06060';
        loadingMsg.textContent = 'Error de conexi&oacute;n';
      }
      messages.scrollTop = messages.scrollHeight;
    }

    function mostrarAjustes() {
      var div = document.createElement('div');
      div.id = 'ajustesPanel';
      div.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#0f0f13;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;overflow-y:auto;';
      div.innerHTML =
        '<div style="font-size:11px;letter-spacing:3px;color:#6a6070;text-transform:uppercase;margin-bottom:8px;">TrimGest</div>' +
        '<div style="font-size:22px;color:#f0ede8;margin-bottom:30px;">Ajustes</div>' +
        '<div style="width:100%;max-width:300px;display:flex;flex-direction:column;gap:12px;">' +
        '<div style="font-size:13px;color:#6a6070;margin-bottom:4px;">Cambiar PIN</div>' +
        '<input id="pinActual" type="password" maxlength="4" placeholder="PIN actual" style="background:#16161e;border:1px solid #2a2a3a;color:#e0d8cc;padding:12px;border-radius:10px;font-size:18px;text-align:center;letter-spacing:8px;width:100%;">' +
        '<input id="pinNuevo" type="password" maxlength="4" placeholder="PIN nuevo" style="background:#16161e;border:1px solid #2a2a3a;color:#e0d8cc;padding:12px;border-radius:10px;font-size:18px;text-align:center;letter-spacing:8px;width:100%;">' +
        '<input id="pinConfirmar" type="password" maxlength="4" placeholder="Confirmar PIN nuevo" style="background:#16161e;border:1px solid #2a2a3a;color:#e0d8cc;padding:12px;border-radius:10px;font-size:18px;text-align:center;letter-spacing:8px;width:100%;">' +
        '<button onclick="cambiarPin()" style="background:#e8c87a;color:#1a1500;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;width:100%;">Cambiar PIN</button>' +
        '<div id="ajustesMsg" style="font-size:13px;text-align:center;margin-top:4px;"></div>' +
        '<div style="margin-top:24px;padding-top:24px;border-top:1px solid #22223a;">' +
        '<div style="font-size:13px;color:#6a6070;margin-bottom:8px;">P&eacute;rdidas y Ganancias</div>' +
        '<div style="font-size:12px;color:#4a4055;margin-bottom:12px;">Sube el PDF de P&G que te manda la gestor&iacute;a al final del trimestre</div>' +
        '<input type="file" id="pygInput" accept="application/pdf" onchange="subirPyG(this.files[0])" style="display:none">' +
        '<button onclick="document.getElementById(\'pygInput\').click()" style="background:#1e1e28;border:1px solid #2a2a3a;color:#9a90b4;border-radius:10px;padding:12px;font-size:14px;cursor:pointer;width:100%;">&#128202; Subir PDF de P&G</button>' +
        '<div id="pygMsg" style="font-size:12px;margin-top:8px;text-align:center;"></div>' +
        '</div>' +
        '</div>' +
        '<button onclick="cerrarAjustes()" style="margin-top:30px;background:none;border:none;color:#6a6070;font-size:13px;cursor:pointer;text-decoration:underline;">&#8592; Volver</button>';
      document.body.appendChild(div);
    }

    function cerrarAjustes() {
      var panel = document.getElementById('ajustesPanel');
      if (panel) panel.remove();
    }

    async function cambiarPin() {
      var actual = document.getElementById('pinActual').value;
      var nuevo = document.getElementById('pinNuevo').value;
      var confirmar = document.getElementById('pinConfirmar').value;
      var msg = document.getElementById('ajustesMsg');
      if (nuevo.length !== 4) { msg.style.color='#c06060'; msg.textContent='El PIN debe tener 4 d&iacute;gitos'; return; }
      if (nuevo !== confirmar) { msg.style.color='#c06060'; msg.textContent='Los PINs no coinciden'; return; }
      var res = await fetch(API + '/auth/cambiar-pin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin_actual: actual, pin_nuevo: nuevo })
      });
      var data = await res.json();
      if (data.ok) {
        msg.style.color='#7ec47e';
        msg.textContent='&#10003; PIN cambiado correctamente';
        setTimeout(cerrarAjustes, 1500);
      } else {
        msg.style.color='#c06060';
        msg.textContent='PIN actual incorrecto';
      }
    }

    async function subirPyG(file) {
      if (!file) return;
      var msg = document.getElementById('pygMsg');
      msg.style.color = '#9a90b4';
      msg.textContent = '&#9203; Procesando...';
      var formData = new FormData();
      formData.append('pyg', file);
      try {
        var res = await fetch(API + '/pyg/subir', { method: 'POST', body: formData });
        var data = await res.json();
        if (data.ok) {
          msg.style.color = '#7ec47e';
          msg.textContent = '&#10003; P&G procesada correctamente';
        } else {
          msg.style.color = '#c06060';
          msg.textContent = 'Error al procesar el PDF';
        }
      } catch(e) {
        msg.style.color = '#c06060';
        msg.textContent = 'Error de conexi&oacute;n';
      }
    }

    async function cargarFacturas() {
      const res = await fetch(API + '/facturas/listar');
      const data = await res.json();
      return data.facturas;
    }

    async function renderApp() {
      const facturas = await cargarFacturas();
      const anno = new Date().getFullYear();
      if (!window.trimestreSel) window.trimestreSel = getTrimestre();
      if (!window.annoSel) window.annoSel = String(anno);

      var anosSet = {};
      for (var y = anno - 2; y <= anno + 3; y++) anosSet[String(y)] = true;
      for (var i = 0; i < facturas.length; i++) {
        if (facturas[i].anno) anosSet[String(facturas[i].anno)] = true;
      }
      var anos = Object.keys(anosSet).sort();

      const facturasT = facturas.filter(function(f) {
        return f.trimestre === window.trimestreSel && String(f.anno) === window.annoSel;
      });

      const pendientes = facturasT.filter(function(f) { return !f.enviado; });
      const enviadas = facturasT.filter(function(f) { return f.enviado; });
      const lista = window.tabSel === 'pendientes' ? pendientes : enviadas;

      const provPend = pendientes.filter(function(f) { return f.tipo === 'proveedor'; });
      const cliPend = pendientes.filter(function(f) { return f.tipo === 'cliente'; });
      const totalProv = provPend.reduce(function(s, f) { return s + Number(f.total); }, 0);
      const totalCli = cliPend.reduce(function(s, f) { return s + Number(f.total); }, 0);

      var listaHTML = '';
      if (lista.length === 0) {
        listaHTML = '<div class="empty">No hay facturas en este apartado</div>';
      } else {
        listaHTML = '<div class="facturas-list">';
        for (var i = 0; i < lista.length; i++) {
          var f = lista[i];
          var optsAnnoEdit = anos.map(function(a) { return '<option value="' + a + '"' + (String(f.anno)===a?' selected':'') + '>' + a + '</option>'; }).join('');
          listaHTML += '<div class="factura-card' + (f.enviado ? ' enviada' : '') + '">';
          listaHTML += '<div class="factura-header"><span class="factura-nombre">' + f.nombre + '</span>';
          listaHTML += '<div class="factura-badges"><span class="factura-badge badge-' + f.tipo + '">' + f.tipo + '</span>';
          if (f.enviado) listaHTML += '<span class="factura-badge badge-enviada">enviada</span>';
          listaHTML += '</div></div>';
          listaHTML += '<div class="factura-datos"><span>' + f.fecha + '</span><span>N&#176; ' + f.numero_factura + '</span><span class="factura-total">' + formatEur(f.total) + '</span></div>';
          listaHTML += '<div class="factura-desglose">Base ' + formatEur(f.base_imponible) + ' &middot; IVA ' + f.iva_porcentaje + '% ' + formatEur(f.iva_importe) + '</div>';
          listaHTML += '<div class="factura-acciones">';
          listaHTML += '<button class="btn-accion" onclick="toggleEdit(' + f.id + ')">&#9998; Editar</button>';
          listaHTML += '<button class="btn-borrar" onclick="borrarFactura(' + f.id + ')">&#128465; Borrar</button>';
          listaHTML += '</div>';
          listaHTML += '<div class="edit-form" id="edit-' + f.id + '">';
          listaHTML += '<div class="edit-row"><select id="tipo-' + f.id + '"><option value="proveedor"' + (f.tipo==='proveedor'?' selected':'') + '>Proveedor</option><option value="cliente"' + (f.tipo==='cliente'?' selected':'') + '>Cliente</option></select>';
          listaHTML += '<select id="trim-' + f.id + '"><option value="T1"' + (f.trimestre==='T1'?' selected':'') + '>T1</option><option value="T2"' + (f.trimestre==='T2'?' selected':'') + '>T2</option><option value="T3"' + (f.trimestre==='T3'?' selected':'') + '>T3</option><option value="T4"' + (f.trimestre==='T4'?' selected':'') + '>T4</option></select>';
          listaHTML += '<select id="anno-' + f.id + '">' + optsAnnoEdit + '</select></div>';
          listaHTML += '<input class="edit-input" id="nombre-' + f.id + '" value="' + f.nombre + '" placeholder="Nombre">';
          listaHTML += '<input class="edit-input" id="nfactura-' + f.id + '" value="' + f.numero_factura + '" placeholder="N&#176; factura">';
          listaHTML += '<input class="edit-input" id="fecha-' + f.id + '" value="' + f.fecha + '" placeholder="DD/MM/YYYY">';
          listaHTML += '<div class="edit-row">';
          listaHTML += '<input class="edit-input" id="base-' + f.id + '" value="' + f.base_imponible + '" placeholder="Base" type="number" style="flex:1">';
          listaHTML += '<input class="edit-input" id="iva-' + f.id + '" value="' + f.iva_porcentaje + '" placeholder="IVA%" type="number" style="flex:0.5">';
          listaHTML += '<input class="edit-input" id="total-' + f.id + '" value="' + f.total + '" placeholder="Total" type="number" style="flex:1">';
          listaHTML += '</div>';
          listaHTML += '<button class="btn-guardar" onclick="guardarEdicion(' + f.id + ')">Guardar cambios</button>';
          listaHTML += '</div></div>';
        }
        listaHTML += '</div>';
      }

      var botonesEnvio = '';
      if (window.tabSel === 'pendientes' && pendientes.length > 0) {
        botonesEnvio =
          '<button class="btn-generar" onclick="generarPDFs()">Generar PDFs para gestor&iacute;a</button>' +
          '<button class="btn-marcar" onclick="marcarEnviadas()">&#10003; Marcar todas como enviadas</button>';
      }

      var optsAno = anos.map(function(a) {
        return '<option value="' + a + '"' + (window.annoSel === a ? ' selected' : '') + '>' + a + '</option>';
      }).join('');

      var trimestres = ['T1', 'T2', 'T3', 'T4'];
      var optsTrim = trimestres.map(function(t) {
        return '<option value="' + t + '"' + (window.trimestreSel === t ? ' selected' : '') + '>' + t + '</option>';
      }).join('');

      var provClass = window.tipoSel === 'proveedor' ? ' selected-prov' : '';
      var cliClass = window.tipoSel === 'cliente' ? ' selected-cli' : '';
      var btnDisabled = !window.tipoSel ? ' disabled' : '';
      var uploadDisplay = window.uploadOpen ? 'block' : 'none';

      document.getElementById('app').innerHTML =
        '<div class="header">' +
        '<div class="header-top"><div><div class="label">TrimGest</div><h1>' + window.trimestreSel + ' &middot; ' + window.annoSel + '</h1></div>' +
        '<div style="display:flex;gap:4px;align-items:center;">' +
        '<button class="btn-ajustes" onclick="mostrarAsesor()">&#129302;</button>' +
        '<button class="btn-ajustes" onclick="mostrarAjustes()">&#9881;&#65039;</button>' +
        '<button class="btn-subir" onclick="toggleUpload()">+ Subir</button>' +
        '</div></div>' +
        '<div class="selectores">' +
        '<select onchange="window.trimestreSel=this.value;renderApp()">' + optsTrim + '</select>' +
        '<select onchange="window.annoSel=this.value;renderApp()">' + optsAno + '</select>' +
        '</div>' +
        '<div class="stats">' +
        '<div class="stat"><div class="stat-label">Proveedores</div><div class="stat-value">' + formatEur(totalProv) + '</div><div class="stat-count">' + provPend.length + ' pendientes</div></div>' +
        '<div class="stat"><div class="stat-label">Clientes</div><div class="stat-value verde">' + formatEur(totalCli) + '</div><div class="stat-count">' + cliPend.length + ' pendientes</div></div>' +
        '</div></div>' +
        '<div class="content">' +
        '<div class="upload-area" id="uploadArea" style="display:' + uploadDisplay + '"><div class="upload-box">' +
        '<div class="upload-title">Subir factura</div>' +
        '<div class="upload-sub">Primero indica qu&eacute; tipo es</div>' +
        '<div class="tipo-selector">' +
        '<div class="tipo-btn' + provClass + '" onclick="seleccionarTipo(\'proveedor\')">&#128706; Proveedor</div>' +
        '<div class="tipo-btn' + cliClass + '" onclick="seleccionarTipo(\'cliente\')">&#127968; Cliente</div>' +
        '</div>' +
        '<div class="upload-btns">' +
        '<button class="btn-file"' + btnDisabled + ' onclick="document.getElementById(\'fileInput\').click()">&#128193; Elegir PDF</button>' +
        '<button class="btn-camara"' + btnDisabled + ' onclick="document.getElementById(\'camaraInput\').click()">&#128247; Escanear</button>' +
        '</div>' +
        '<input type="file" id="fileInput" accept="application/pdf" onchange="procesarArchivo(this.files[0])" style="display:none">' +
        '<input type="file" id="camaraInput" accept="image/*" capture="environment" onchange="procesarArchivo(this.files[0])" style="display:none">' +
        '<div id="uploadStatus"></div>' +
        '</div></div>' +
        '<div class="tabs">' +
        '<div class="tab' + (window.tabSel==='pendientes'?' active':'') + '" onclick="window.tabSel=\'pendientes\';renderApp()">Pendientes (' + pendientes.length + ')</div>' +
        '<div class="tab' + (window.tabSel==='enviadas'?' active':'') + '" onclick="window.tabSel=\'enviadas\';renderApp()">Enviadas (' + enviadas.length + ')</div>' +
        '</div>' +
        '<div class="section-title">Facturas del periodo</div>' +
        listaHTML + botonesEnvio + '</div>';
    }

    function seleccionarTipo(tipo) {
      window.tipoSel = tipo;
      var btns = document.querySelectorAll('.tipo-btn');
      btns[0].className = 'tipo-btn' + (tipo === 'proveedor' ? ' selected-prov' : '');
      btns[1].className = 'tipo-btn' + (tipo === 'cliente' ? ' selected-cli' : '');
      document.querySelector('.btn-file').disabled = false;
      document.querySelector('.btn-camara').disabled = false;
    }

    function toggleUpload() {
      window.uploadOpen = !window.uploadOpen;
      if (!window.uploadOpen) window.tipoSel = null;
      renderApp();
    }

    function toggleEdit(id) {
      var form = document.getElementById('edit-' + id);
      form.style.display = form.style.display === 'flex' ? 'none' : 'flex';
    }

    async function guardarEdicion(id) {
      var body = {
        tipo: document.getElementById('tipo-' + id).value,
        trimestre: document.getElementById('trim-' + id).value,
        anno: document.getElementById('anno-' + id).value,
        nombre: document.getElementById('nombre-' + id).value,
        numero_factura: document.getElementById('nfactura-' + id).value,
        fecha: document.getElementById('fecha-' + id).value,
        base_imponible: document.getElementById('base-' + id).value,
        iva_porcentaje: document.getElementById('iva-' + id).value,
        total: document.getElementById('total-' + id).value
      };
      await fetch(API + '/facturas/editar/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      renderApp();
    }

    async function borrarFactura(id) {
      if (!confirm('¿Seguro que quieres borrar esta factura?')) return;
      await fetch(API + '/facturas/borrar/' + id, { method: 'DELETE' });
      renderApp();
    }

    async function marcarEnviadas() {
      const facturas = await cargarFacturas();
      const pendientes = facturas.filter(function(f) {
        return f.trimestre === window.trimestreSel && String(f.anno) === window.annoSel && !f.enviado;
      });
      const ids = pendientes.map(function(f) { return f.id; });
      await fetch(API + '/facturas/marcar-enviado', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: ids })
      });
      renderApp();
    }

    async function procesarArchivo(file) {
      if (!file) return;
      var status = document.getElementById('uploadStatus');
      status.innerHTML = '<div class="uploading">&#9203; Procesando con IA...</div>';
      var formData = new FormData();
      formData.append('factura', file);
      try {
        var res = await fetch(API + '/facturas/subir?tipo_manual=' + window.tipoSel, { method: 'POST', body: formData });
        var data = await res.json();
        if (data.error === 'duplicado') {
          status.innerHTML = '<div class="duplicado">&#9888; Esta factura ya est&aacute; en el sistema</div>';
        } else if (data.factura) {
          window.trimestreSel = data.factura.trimestre;
          window.annoSel = String(data.factura.anno);
          window.tipoSel = null;
          window.uploadOpen = false;
          status.innerHTML = '<div class="success">&#10003; Factura procesada correctamente</div>';
          setTimeout(function() { renderApp(); }, 1500);
        } else {
          status.innerHTML = '<div class="error">Error al procesar la factura</div>';
        }
      } catch(e) {
        status.innerHTML = '<div class="error">Error de conexi&oacute;n</div>';
      }
    }

    function generarPDFs() {
      var t = window.trimestreSel;
      var a = window.annoSel;
      window.open(API + '/generar/pdf/proveedor/' + t + '/' + a);
      setTimeout(function() {
        window.open(API + '/generar/pdf/cliente/' + t + '/' + a);
      }, 1000);
    }
  </script>
</body>
</html>
